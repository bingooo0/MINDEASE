<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login</title>
<style>
  :root {
    --mint-bg: #cfe3d8;
    --panel-light: #e3efe9;
    --teal-dark: #1f6f5c;
    --teal-darker: #175646;
    --text: #14251f;
    --muted: #4b6358;
    --border: #9fc2b2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--mint-bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .auth-card {
    display: flex;
    width: 100%;
    max-width: 780px;
    min-height: 460px;
    background: var(--mint-bg);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(20, 37, 31, 0.15);
  }
  .form-side {
    flex: 1;
    padding: 48px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  label {
    display: block;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
    font-size: 0.95rem;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 22px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: transparent;
    font-size: 0.95rem;
    color: var(--text);
  }
  input:focus {
    outline: none;
    border-color: var(--teal-dark);
  }
  button#loginBtn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 999px;
    background: var(--teal-dark);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button#loginBtn:hover { background: var(--teal-darker); }
  .form-footer {
    margin-top: 16px;
    text-align: center;
    font-size: 0.85rem;
    color: var(--text);
  }
  .form-footer a {
    color: var(--teal-dark);
    font-weight: 600;
    text-decoration: none;
  }
  .form-footer a:hover { text-decoration: underline; }
  .forgot-link {
    text-align: right;
    display: block;
    margin-top: -12px;
    margin-bottom: 20px;
    font-size: 0.85rem;
  }
  .forgot-link a { color: var(--teal-dark); text-decoration: none; }
  .forgot-link a:hover { text-decoration: underline; }

  .brand-side {
    flex: 1;
    background: var(--panel-light);
    margin: 14px;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
  }
  .brand-icon {
    width: 90px;
    height: 90px;
    margin-bottom: 16px;
    object-fit: contain;
  }
  .brand-name {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 4px;
  }
  .brand-tagline {
    font-size: 0.95rem;
    color: var(--muted);
    margin: 0;
  }
  .brand-footer {
    margin-top: 40px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  @media (max-width: 640px) {
    .auth-card { flex-direction: column; }
    .brand-side { margin: 10px; }
  }
</style>
</head>
<body>

<div class="auth-card">
  <div class="form-side">
    <label for="username">Email or Username</label>
    <input id="username" type="text" autocomplete="username" />

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />

    <span class="forgot-link"><a href="#">Forgot Password?</a></span>

    <button id="loginBtn">Login</button>

    <p class="form-footer">Don't have an account? <a href="#">Sign Up</a></p>
  </div>

  <div class="brand-side">
    <img class="brand-icon" src="logo.png" alt="Logo" />
    <h2 class="brand-name">MindEase</h2>
    <p class="brand-tagline">Find peace in every breath</p>
    <p class="brand-footer">Your Health is Our Priority</p>
  </div>
</div>

</body>
</html>
